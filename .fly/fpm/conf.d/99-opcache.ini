; Zend OPcache tuning for production (php-fpm only).
;
; The extension itself is loaded by the distro's own 10-opcache.ini, which apt creates
; when php8.4-opcache is installed. This file is numbered 99 so it is read *after* that
; one and only overrides tuning values -- naming it 10-opcache.ini would replace the
; distro symlink and drop the `zend_extension=opcache.so` line, disabling OPcache
; entirely while looking like it was configured.

opcache.enable=1

; CLI processes here are short-lived (artisan, the schedule:run cron) and would discard
; the cache on exit, so populating one costs more time than it saves.
opcache.enable_cli=0

; This memory is shared across all php-fpm workers, not allocated per worker.
; Sized for ~9k PHP files (vendor after --no-dev, plus app code and compiled Blade).
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; The container image is immutable -- no PHP file can change while the machine runs, and
; config:cache finishes before php-fpm is started by supervisor. Turning off revalidation
; removes a stat() syscall per included file per request.
; Consequence: changing code requires a new image and a deploy to take effect, which is
; already the only way this app is deployed.
opcache.validate_timestamps=0

; Laravel and several vendor packages read docblocks via reflection, so comments must be
; kept. This is the default; set explicitly so it survives any future tuning.
opcache.save_comments=1
